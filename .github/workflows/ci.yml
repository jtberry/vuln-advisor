name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dev dependencies
        run: pip install black isort ruff

      - name: black — check formatting
        run: black --check --diff .

      - name: isort — check import order
        run: isort --check-only --diff .

      - name: ruff — lint
        run: ruff check .

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: bandit — static code security scan
        run: bandit -r core/ cache/ api/ cmdb/ auth/ -q

      - name: pip-audit — dependency vulnerability scan (requirements.txt)
        run: pip-audit -r requirements.txt

      - name: pip-audit — dependency vulnerability scan (requirements-api.txt)
        run: |
          pip-audit -r requirements-api.txt \
            --ignore-vuln GHSA-2c2j-9gv5-cj73 \
            --ignore-vuln GHSA-7f5h-v6xp-fcq8 \
            --ignore-vuln GHSA-wp53-j4wj-2cfg \
            --ignore-vuln GHSA-wj6h-64fc-37mp

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install semgrep
        run: pip install semgrep

      - name: semgrep — Python + FastAPI rules
        run: semgrep scan --config "p/python" --config "p/fastapi" --error --quiet .

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits in the PR

      - name: gitleaks — detect hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Import Smoke Test
    runs-on: ubuntu-latest

    # asgi -> api.main and auth.tokens both call get_settings() at import time,
    # which raises unless DEBUG is set or a >=32 char SECRET_KEY is supplied.
    env:
      DEBUG: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Step order matters: the CLI boundary must be checked BEFORE the API
      # dependencies are present, otherwise it proves nothing.
      - name: Install runtime dependencies only
        run: pip install -r requirements.txt

      # Guards the documented lightweight install. Importing main.py pulls the
      # whole CLI path (cache.store, core.fetcher/formatter/models/pipeline),
      # so if any of them grows a dependency that is not in requirements.txt,
      # this fails. The previous version imported three leaf modules by name and
      # missed exactly that -- core/fetcher.py started importing core.config,
      # which needs pydantic-settings, and the job went red without anyone
      # noticing because the run was already red elsewhere.
      - name: CLI imports with runtime deps alone
        run: |
          python -c "import main; print('CLI imports OK')"
          python main.py --help > /dev/null && echo "CLI --help OK"

      - name: Install API dependencies
        run: pip install -r requirements-api.txt

      # asgi.py is what uvicorn actually loads -- it is the only module that
      # assembles both api/ and web/. A broken import in web/routes.py would
      # pass the CLI check above and still take the server down.
      - name: ASGI app assembles with API deps
        run: python -c "import asgi; assert asgi.app is not None; print('ASGI app OK')"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    # tests/conftest.py sets DEBUG via os.environ.setdefault, which only works
    # if nothing imports core.config before conftest line 30 runs. Setting it
    # here removes that import-order dependency -- without DEBUG, get_settings()
    # raises ValueError("SECRET_KEY is required in production mode").
    env:
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # requirements-api.txt is required, not optional: tests/conftest.py
      # imports fastapi.testclient, api.main, auth.store and cmdb.store at
      # module scope, so the whole suite fails to collect without it.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-api.txt -r requirements-test.txt

      - name: pytest with coverage
        run: pytest

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vulnadvisor:scan .

      - name: Trivy — container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnadvisor:scan
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
