[tool.black]
line-length = 120
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "UP",  # pyupgrade (modernize Python syntax)
    "I",   # isort (import order — belt and suspenders with isort hook)
    "S",   # flake8-bandit (security issues in code)
    "C4",  # flake8-comprehensions (unnecessary list/dict/set calls)
]
ignore = [
    "S101",  # assert statements -- fine in non-test code here
    "S311",  # standard pseudo-random -- not used for cryptography here
    "B008",  # Depends() in FastAPI defaults -- this IS the canonical FastAPI DI pattern;
             # FastAPI inspects the signature and re-calls Depends per request, not once
             # at definition time as the rule assumes.
]

[tool.ruff.lint.per-file-ignores]
# Ignore security rules in test files if added later
"tests/**" = ["S"]

[tool.bandit]
exclude_dirs = ["venv", ".venv", "tests"]
skips = ["B101"]  # skip assert warnings (same as ruff S101)

[tool.bandit.assert_used]
skips = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags deliberately do NOT live here.
#
# With --cov-fail-under in addopts, running a single file (`pytest
# tests/test_enricher.py`) fails the global gate spuriously, because one file
# cannot cover the whole codebase. That trains people to pass --no-cov, and then
# to stop looking at coverage at all. CI and `make test` pass the flags
# explicitly instead; a bare `pytest` just runs the tests.
#
# It also means bare `pytest` no longer hard-fails when pytest-cov is absent.
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# Coverage
#
# Scope is the whole repo, not three modules. The previous configuration
# measured core.enricher + core.pipeline + cmdb.ingest -- about 860 of ~8,270
# lines -- so an 80% gate described roughly 10% of the codebase while auth/,
# api/, web/, cache/, core/formatter.py and the CLI went unmeasured.
#
# branch = true counts branch coverage, not just statements. It was expected to
# drop the three previously-gated modules below their 80 floor; measured, it
# barely moved them (enricher 99%, pipeline 100%, ingest 100%, combined 99%), so
# that floor carries over unchanged. See coverage-baseline.txt.
#
# This milestone measures only. Enforcement (per-module floors plus a ratchet
# against coverage-baseline.txt) is deferred to M12 -- there is no point gating
# a number nobody has seen yet.
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv*/*",
    "venv/*",
    "*/site-packages/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
